aid: aspect-biosystems
name: Aspect Biosystems
description: 'Aspect Biosystems is a Vancouver, British Columbia biotechnology company
  developing Bioprinted Tissue Therapeutics — implantable, allogeneic living tissues
  designed to replace, repair, or supplement biological function in the body. Spun
  out of an interdisciplinary medicine-and-engineering collaboration at the University
  of British Columbia in 2013, the company operates a self-described full-stack tissue
  therapeutic platform that integrates proprietary AI-powered microfluidic bioprinting,
  computational tissue design tools, therapeutic and hypoimmune-engineered cells, and
  advanced biomaterials. Its clinical pipeline targets metabolic and endocrine disease,
  led by pancreatic tissue programs for type 1 diabetes and programs in rare endocrine
  disorders and liver disease. Aspect has raised more than US$350M, including a US$115M
  Series B, and holds partnerships with Novo Nordisk (announced 2023, valued at over
  US$2.6B in milestones) and the governments of Canada and British Columbia. It is a
  private, pre-commercial therapeutics developer: it publishes no public developer
  portal, API documentation, SDKs, or machine-readable API contract.'
